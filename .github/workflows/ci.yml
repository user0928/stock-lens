name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      STOCK_LENS_DATA_DIR: /tmp/stock-lens-test-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pytest -q -p no:cacheprovider
      - run: npm ci
      - run: npm test
      - run: npm run build
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t stock-lens:test .
      - name: Smoke test an empty install
        run: |
          docker run -d --name stock-lens -p 8765:8765 stock-lens:test
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8765/api/health; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8765/api/health
          curl --fail http://127.0.0.1:8765/
          docker logs stock-lens
